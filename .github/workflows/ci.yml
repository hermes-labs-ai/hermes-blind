name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest -v --tb=short

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Isolated install smoke test
        run: |
          python -m venv /tmp/isolated
          /tmp/isolated/bin/pip install dist/*.whl
          /tmp/isolated/bin/hermes-blind --help
          /tmp/isolated/bin/hermes-blind apply --help
          /tmp/isolated/bin/python -m hermes_blind.evidence --help
          /tmp/isolated/bin/python -m hermes_blind.evidence \
            --session fixtures/lab/claude-first-turn.jsonl >/dev/null
          /tmp/isolated/bin/python -c "from hermes_blind import wrap, extract_disclosure, VARIANTS; \
            assert 'HERMES-BLIND' in wrap('x'); \
            assert wrap('y', variant='null') == 'y'; \
            assert {'null', 'micro', 'short', 'v1', 'full'} <= set(VARIANTS); \
            print('smoke ok')"
