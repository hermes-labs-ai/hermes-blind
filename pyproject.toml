[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-blind"
version = "0.2.0"
description = "Local recovery anchors for Claude Code and Codex sessions, plus evidence-gated evaluation prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hermes Labs", email = "roli@hermes-labs.ai" }]
keywords = [
    "ai-agents",
    "claude-code",
    "codex",
    "drift-recovery",
    "llm-evaluation",
    "prompt-engineering",
    "session-recovery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
hermes-blind = "hermes_blind.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.urls]
"Homepage" = "https://hermes-labs.ai/open-source"
"Documentation" = "https://github.com/hermes-labs-ai/hermes-blind#readme"
"Source" = "https://github.com/hermes-labs-ai/hermes-blind"
"Issues" = "https://github.com/hermes-labs-ai/hermes-blind/issues"
"Changelog" = "https://github.com/hermes-labs-ai/hermes-blind/blob/main/CHANGELOG.md"
"Evaluation" = "https://github.com/hermes-labs-ai/hermes-blind/blob/main/EVALUATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
